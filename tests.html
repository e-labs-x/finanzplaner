<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanzplaner — Berechnungs-Tests</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #f8f9fa; color: #1a1a1a; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #666; font-size: 13px; margin: 0 0 24px; }
  button#run { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 14px; cursor: pointer; }
  button#run:hover { background: #1d4ed8; }
  button#run:disabled { background: #93c5fd; cursor: default; }
  #results { margin-top: 24px; }
  .summary { font-weight: 700; font-size: 15px; margin-bottom: 14px; padding: 10px 14px; border-radius: 8px; }
  .summary.ok  { background: #dcfce7; color: #166534; }
  .summary.err { background: #fee2e2; color: #991b1b; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; background: #e5e7eb; font-weight: 600; }
  td { padding: 8px 10px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  .pass { color: #16a34a; font-weight: 600; }
  .fail { color: #dc2626; font-weight: 600; }
  .err-msg { font-size: 11px; color: #dc2626; margin-top: 3px; font-family: monospace; word-break: break-all; }
  #notice { font-size: 12px; color: #888; margin-top: 16px; }
</style>
</head>
<body>

<h1>Finanzplaner — Berechnungs-Tests</h1>
<p class="sub">Prüft ob Kernberechnungen und Datenverwaltung korrekt funktionieren.<br>
Eigene Daten werden nicht verändert — Tests laufen auf einem isolierten Standard-Datensatz.</p>

<button id="run" onclick="runTests()">Tests ausführen</button>
<div id="results"></div>
<p id="notice"></p>

<script src="store.js?v=20260524g"></script>
<script>
'use strict';

var _results = [];
var _savedLS = null;

// ── Hilfsfunktionen ──────────────────────────────────────────────────────────

function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'Assertion fehlgeschlagen');
}
function assertNum(v, label) {
  if (typeof v !== 'number' || isNaN(v)) throw new Error(label + ' ist kein Number — erhalten: ' + JSON.stringify(v));
}
function assertGte(v, min, label) {
  assertNum(v, label);
  if (v < min) throw new Error(label + ' = ' + v + ', erwartet ≥ ' + min);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Async-fähiger Test-Wrapper
async function test(name, category, fn) {
  try {
    await fn();
    _results.push({ name: name, category: category, ok: true });
  } catch(e) {
    _results.push({ name: name, category: category, ok: false, err: e.message });
  }
}

// ── Store-Setup ──────────────────────────────────────────────────────────────

var _savedBK = null;
var BK_KEY = 'finanzplaner_v3_backups';

function setupTestStore() {
  _savedLS = localStorage.getItem('finanzplaner_v3');
  _savedBK = localStorage.getItem(BK_KEY);
  localStorage.removeItem('finanzplaner_v3');
  localStorage.removeItem(BK_KEY);
  FP.Store.load(); // lädt Default-Store (person_1 = Person 1, person_2 = Partner)

  // Default-Store hat kein Geburtsdatum mehr → festes Testdatum (gleicher Weg wie stSaveStammdaten)
  FP.Store.get().persons.find(function(p) { return p.id === 'person_1'; }).birthDate = '15.03.1980';

  // Minimal-Gehalt damit calcRente sinnvoll rechnet
  FP.Store.Salary.set('person_1', '01.2026', { grossSalary: 4500, netSalary: 3000 });
  FP.Store.Salary.set('person_1', '02.2026', { grossSalary: 4500, netSalary: 3000 });
  FP.Store.Salary.set('person_1', '03.2026', { grossSalary: 4500, netSalary: 3000 });
}

function restoreRealStore() {
  if (_savedLS !== null) localStorage.setItem('finanzplaner_v3', _savedLS);
  else localStorage.removeItem('finanzplaner_v3');
  if (_savedBK !== null) localStorage.setItem(BK_KEY, _savedBK);
  else localStorage.removeItem(BK_KEY);
}

function lsStore() { return JSON.parse(localStorage.getItem('finanzplaner_v3') || 'null'); }
function backupFile(obj) {
  return new File([new Blob([JSON.stringify(obj)], { type: 'application/json' })], 'test.fpbackup');
}
function hasNote(store, note) {
  return !!store && store.transactions.some(function(tx) { return tx.note === note; });
}

// ── Test-Runner ──────────────────────────────────────────────────────────────

async function runTests() {
  _results = [];
  document.getElementById('results').innerHTML = '';
  document.getElementById('notice').textContent = '';
  document.getElementById('run').disabled = true;

  try {
    setupTestStore();

    // ── 1. Store-CRUD ─────────────────────────────────────────────────────────

    await test('Transaktion hinzufügen erhöht Anzahl', 'Store-CRUD', function() {
      var vorher = FP.Store.Transactions.getAll().length;
      FP.Store.Transactions.add({ amount: 42.50, date: '05.2026', categoryId: 'cat_restaurant' });
      var nachher = FP.Store.Transactions.getAll().length;
      assert(nachher === vorher + 1, 'Erwartet +1, bekam +' + (nachher - vorher));
    });

    await test('Transaktion in Papierkorb verschieben', 'Store-CRUD', function() {
      var tx = FP.Store.Transactions.add({ amount: 9.99, date: '05.2026', categoryId: 'cat_kaffee' });
      var vorher = FP.Store.Transactions.getAll().length;
      assert(FP.Store.Transactions.delete(tx.id) === true, 'delete() meldet keinen Erfolg');
      var nachher = FP.Store.Transactions.getAll().length;
      assert(nachher === vorher - 1, 'Transaktion nicht aus Liste entfernt');
      assert(!FP.Store.Transactions.getById(tx.id), 'Transaktion noch auffindbar');
      assert(FP.Trash.getAll().some(function(e) { return e.type === 'transaction' && e.item.id === tx.id; }), 'Nicht im Papierkorb gelandet');
      assert(FP.Store.Transactions.delete(tx.id) === false, 'Zweites delete() meldet fälschlich Erfolg');
    });

    await test('Transaktion aus Papierkorb wiederherstellen', 'Store-CRUD', function() {
      var tx = FP.Store.Transactions.add({ amount: 14.50, date: '05.2026', categoryId: 'cat_kaffee', note: 'Restore-Test' });
      FP.Store.Transactions.delete(tx.id);
      var entry = FP.Trash.getAll().find(function(e) { return e.item.id === tx.id; });
      FP.Trash.restore(entry.id);
      var back = FP.Store.Transactions.getById(tx.id);
      assert(back, 'Nicht zurück in der Liste');
      assert(back.amount === 14.5 && back.note === 'Restore-Test' && back.date === '05.2026', 'Felder nicht unverändert');
      assert(!FP.Trash.getAll().some(function(e) { return e.id === entry.id; }), 'Noch im Papierkorb');
    });

    await test('Wiederherstellen erzeugt keine Doppelung', 'Store-CRUD', function() {
      var tx = FP.Store.Transactions.add({ amount: 7, date: '05.2026', categoryId: 'cat_kaffee' });
      FP.Store.Transactions.delete(tx.id);
      FP.Store.get().transactions.push(JSON.parse(JSON.stringify(tx))); // z. B. per Sync-Merge zurückgekommen
      var entry = FP.Trash.getAll().find(function(e) { return e.item.id === tx.id; });
      FP.Trash.restore(entry.id);
      var n = FP.Store.Transactions.getAll().filter(function(t) { return t.id === tx.id; }).length;
      assert(n === 1, 'Buchung ' + n + '-mal vorhanden');
    });

    await test('Kategorie anlegen und wiederfinden', 'Store-CRUD', function() {
      var cat = FP.Store.Categories.add({ name: 'Test-Kategorie-XYZ', parentId: null });
      assert(FP.Store.Categories.getAll().some(function(c) { return c.id === cat.id; }), 'Kategorie nicht in Liste');
    });

    await test('Objekt anlegen', 'Store-CRUD', function() {
      var obj = FP.Store.Objects.add({ name: 'Test-Auto', type: 'auto' });
      assert(obj && obj.id, 'Kein Objekt zurückgegeben');
      assert(FP.Store.Objects.getAll().some(function(o) { return o.id === obj.id; }), 'Objekt nicht in Liste');
    });

    await test('Gehalt-Datenpunkt korrekt gespeichert', 'Store-CRUD', function() {
      var data = FP.Store.Salary.get('person_1', '01.2026');
      assert(data !== null, 'Keine Gehaltsdaten für 01.2026');
      assert(data.grossSalary === 4500, 'grossSalary falsch: ' + data.grossSalary);
      assert(data.netSalary === 3000, 'netSalary falsch: ' + data.netSalary);
    });

    // ── 2. Datenvalidierung ───────────────────────────────────────────────────

    await test('Store-Struktur vollständig', 'Validierung', function() {
      var s = FP.Store.get();
      assert(Array.isArray(s.transactions), 'transactions fehlt');
      assert(Array.isArray(s.categories),   'categories fehlt');
      assert(Array.isArray(s.persons),      'persons fehlt');
      assert(typeof s.salary === 'object',  'salary fehlt');
      assert(s.meta && typeof s.meta.version === 'number', 'meta.version fehlt');
    });

    // Default-Store ist seit 07.06.2026 neutral (birthDate leer) — das Testdatum kommt aus setupTestStore().
    await test('Geburtsdatum fließt ins Alter ein', 'Validierung', function() {
      var p = FP.Store.get().persons.find(function(x) { return x.id === 'person_1'; });
      assert(p, 'person_1 nicht gefunden');
      assert(p.birthDate === '15.03.1980', 'Test-Geburtsdatum fehlt: ' + p.birthDate);
      var r = FP.Calculator.calcRente('person_1', null);
      var erwartet = new Date().getFullYear() - 1980;
      assert(r.currentAge === erwartet, 'currentAge ' + r.currentAge + ', erwartet ' + erwartet);
    });

    await test('System-Kategorien vorhanden', 'Validierung', function() {
      var cats = FP.Store.Categories.getAll();
      assert(cats.length >= 10, 'Zu wenige System-Kategorien: ' + cats.length);
      assert(cats.some(function(c) { return c.id === 'cat_lebensmittel'; }), 'cat_lebensmittel fehlt');
      assert(cats.some(function(c) { return c.id === 'cat_restaurant'; }),   'cat_restaurant fehlt');
    });

    // ── 3. Backup-Zyklus ──────────────────────────────────────────────────────

    await test('Backup hat korrektes Format', 'Backup', function() {
      var backup = FP.BackupManager.create('Test');
      assert(backup._backup && backup._backup.format === 'fpbackup', 'Format falsch');
      assert(backup.store, 'store-Block fehlt');
      assert(Array.isArray(backup.store.transactions), 'transactions im Backup fehlt');
    });

    await test('Backup-Roundtrip: Daten überleben Export und Import', 'Backup', async function() {
      // Transaktion mit erkennbarem Betrag anlegen
      FP.Store.Transactions.add({ amount: 777.77, date: '04.2026', categoryId: 'cat_sonstiges', note: 'Roundtrip-Test' });
      var backup   = FP.BackupManager.create('Roundtrip');
      var txAnzahl = backup.store.transactions.length;

      var blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
      var file = new File([blob], 'test.fpbackup');
      var res  = await FP.BackupManager.import(file);

      assert(res.ok, 'Import lieferte ok=false');
      FP.Store.load(); // _state nach Import neu einlesen
      var txNach = FP.Store.Transactions.getAll().length;
      assert(txNach === txAnzahl, 'Tx-Anzahl nach Import: ' + txNach + ' (erwartet: ' + txAnzahl + ')');
      assert(
        FP.Store.Transactions.getAll().some(function(tx) {
          return tx.amount === 777.77 && tx.note === 'Roundtrip-Test';
        }),
        'Roundtrip-Transaktion nicht wiedergefunden'
      );
    });

    // ── 3b. Ein Schreibweg (Paket 1, 18.10.2026) ──────────────────────────────

    await test('Import wird nicht von späterem Speichern zurückgeschrieben', 'Speichern', async function() {
      FP.Store.load();
      FP.Store.Transactions.add({ amount: 1.11, date: '04.2026', categoryId: 'cat_sonstiges', note: 'IMPORTIERT' });
      var json = JSON.stringify(FP.BackupManager.create('T'));
      FP.Store.Transactions.add({ amount: 2.22, date: '04.2026', categoryId: 'cat_sonstiges', note: 'ALT' });
      await FP.BackupManager.import(new File([json], 't.fpbackup'), { log: ['BACKUP', 'Test-Import'] });
      // genau das, was die UI früher nach dem Import tat — und was den alten Stand zurückschrieb
      FP.Store.appLog('BACKUP', 'danach');
      FP.Store.Transactions.add({ amount: 3.33, date: '04.2026', categoryId: 'cat_sonstiges', note: 'NACH-IMPORT' });
      var s = lsStore();
      assert(hasNote(s, 'IMPORTIERT'), 'importierte Buchung fehlt im Speicher');
      assert(!hasNote(s, 'ALT'), 'alter Stand wurde zurückgeschrieben');
      assert(!hasNote(s, 'NACH-IMPORT'), 'Speichern nach dem Import war nicht gesperrt');
      assert(s.log[0].msg === 'Test-Import', 'Log-Eintrag nicht mit dem neuen Stand gespeichert');
      FP.Store.load();
      assert(FP.Store.writeLock() === null, 'Sperre nach load() nicht aufgehoben');
    });

    await test('Auto-Sicherung wiederherstellen bleibt bestehen', 'Speichern', function() {
      FP.Store.load();
      FP.Store.Transactions.add({ amount: 4.44, date: '04.2026', categoryId: 'cat_sonstiges', note: 'GESICHERT' });
      FP.BackupManager._saveAutoBackup(FP.BackupManager.create('T'));
      FP.Store.Transactions.add({ amount: 5.55, date: '04.2026', categoryId: 'cat_sonstiges', note: 'SPAETER' });
      FP.BackupManager.restoreAutoBackup(0);
      FP.Store.appLog('BACKUP', 'danach');
      var s = lsStore();
      assert(hasNote(s, 'GESICHERT') && !hasNote(s, 'SPAETER'), 'Wiederherstellung wurde überschrieben');
      FP.Store.load();
    });

    await test('Import behält Sync-Stempel des Geräts (lastETag)', 'Speichern', async function() {
      FP.Store.load();
      FP.Store.Settings.setAzureSync({ lastETag: '"GERAET"' });
      var b = JSON.parse(JSON.stringify(FP.BackupManager.create('T')));
      b.store.settings.azureSync.lastETag = '"AUS-DATEI"';
      await FP.BackupManager.import(backupFile(b));
      assert(lsStore().settings.azureSync.lastETag === '"GERAET"', 'lastETag: ' + lsStore().settings.azureSync.lastETag);
      FP.Store.load();
      await FP.BackupManager.import(backupFile(b), { azureSync: { lastETag: '"PULL"' } });
      assert(lsStore().settings.azureSync.lastETag === '"PULL"', 'Pull-ETag nicht übernommen');
      FP.Store.load();
      FP.Store.Settings.setAzureSync({ lastETag: null });
    });

    await test('importData übernimmt synchron und lässt die Quelle unverändert', 'Speichern', function() {
      FP.Store.load();
      FP.Store.Transactions.add({ amount: 9.01, date: '04.2026', categoryId: 'cat_sonstiges', note: 'SYNCHRON' });
      var src = JSON.parse(JSON.stringify(FP.BackupManager.create('T')));
      var before = JSON.stringify(src);
      FP.Store.Transactions.add({ amount: 9.02, date: '04.2026', categoryId: 'cat_sonstiges', note: 'DANACH' });
      FP.BackupManager.importData(src, { azureSync: { lastETag: '"S1"' } });
      var s = lsStore();   // ohne await: schon im selben Takt geschrieben
      assert(hasNote(s, 'SYNCHRON') && !hasNote(s, 'DANACH'), 'nicht synchron übernommen');
      assert(s.settings.azureSync.lastETag === '"S1"', 'Sync-Felder nicht gesetzt');
      assert(JSON.stringify(src) === before, 'Quelle wurde verändert');
      FP.Store.load();
      FP.Store.Settings.setAzureSync({ lastETag: null });
    });

    await test('Unlesbare Daten werden nicht überschrieben', 'Speichern', function() {
      var good = localStorage.getItem('finanzplaner_v3');
      FP.BackupManager._saveAutoBackup(FP.BackupManager.create('Gut'));
      var bk = localStorage.getItem(BK_KEY);
      localStorage.setItem('finanzplaner_v3', '{"kaputt":');
      var res = FP.Store.load();
      assert(!res.ok && FP.Store.writeLock() === 'load-failed', 'Ladefehler nicht erkannt');
      FP.Store.Transactions.add({ amount: 6.66, date: '04.2026', categoryId: 'cat_sonstiges', note: 'X' });
      FP.BackupManager._saveAutoBackup(FP.BackupManager.create('Leer'));
      assert(localStorage.getItem('finanzplaner_v3') === '{"kaputt":', 'Rohdaten wurden überschrieben');
      assert(localStorage.getItem(BK_KEY) === bk, 'leerer Stand hat Auto-Sicherungen verändert');
      // Wiederherstellen ist der eine erlaubte Weg aus der Sperre
      FP.BackupManager.restoreAutoBackup(0);
      assert(lsStore() && Array.isArray(lsStore().transactions), 'Wiederherstellung trotz Sperre nicht möglich');
      localStorage.setItem('finanzplaner_v3', good);
      FP.Store.load();
    });

    await test('Speicher voll: Hauptdaten verdrängen Auto-Sicherungen', 'Speichern', function() {
      FP.Store.load();
      var orig = Storage.prototype.setItem;
      var limit;
      Storage.prototype.setItem = function(k, v) {
        var other = k === 'finanzplaner_v3' ? (this.getItem(BK_KEY) || '') : (this.getItem('finanzplaner_v3') || '');
        if (limit && other.length + String(v).length > limit) {
          var e = new Error('QuotaExceededError'); e.name = 'QuotaExceededError'; throw e;
        }
        return orig.call(this, k, v);
      };
      var events = [];
      function onEv(e) { events.push(e.detail.type); }
      window.addEventListener('fp:store', onEv);
      try {
        var pad = new Array(3000).join('x');
        orig.call(localStorage, BK_KEY, JSON.stringify([1,2,3].map(function(i) { return { timestamp: 't' + i, label: pad, data: {} }; })));
        limit = localStorage.getItem('finanzplaner_v3').length + localStorage.getItem(BK_KEY).length + 500;
        FP.Store.Transactions.add({ amount: 7.77, date: '04.2026', categoryId: 'cat_sonstiges', note: 'GROSS' + new Array(1500).join('y') });
        var n = JSON.parse(localStorage.getItem(BK_KEY) || '[]').length;
        assert(hasNote({ transactions: lsStore().transactions.map(function(t) { return { note: (t.note || '').slice(0, 5) }; }) }, 'GROSS'), 'Hauptdaten nicht gespeichert');
        assert(n >= 1 && n < 3, 'erwartet 1–2 verbleibende Sicherungen, sind ' + n);
        assert(events.indexOf('save-failed') < 0, 'fälschlich als fehlgeschlagen gemeldet');
        limit = 100; // passt gar nicht mehr
        var ok = FP.Store.save();
        assert(ok === false && events.indexOf('save-failed') >= 0, 'Fehlschlag nicht gemeldet');
      } finally {
        Storage.prototype.setItem = orig;
        window.removeEventListener('fp:store', onEv);
        FP.Store.load();
      }
    });

    await test('Auto-Sicherungen werden nicht verschachtelt', 'Speichern', function() {
      FP.Store.load();
      localStorage.removeItem(BK_KEY);
      var b = FP.BackupManager.create('Manuell');
      b.autoBackups = [{ timestamp: 'x', data: { store: {} } }];
      FP.BackupManager._saveAutoBackup(b);
      // Alt-Eintrag mit Verschachtelung wird beim nächsten Schreiben verschlankt
      var list = JSON.parse(localStorage.getItem(BK_KEY));
      list[0].data.autoBackups = [{ timestamp: 'y' }];
      localStorage.setItem(BK_KEY, JSON.stringify(list));
      FP.BackupManager._saveAutoBackup(FP.BackupManager.create('Täglich'));
      var all = JSON.parse(localStorage.getItem(BK_KEY));
      assert(all.length === 2, 'Anzahl ' + all.length);
      assert(all.every(function(e) { return !('autoBackups' in e.data); }), 'Verschachtelung gespeichert');
      assert(b.autoBackups, 'Download-Objekt selbst darf nicht verändert werden');
      localStorage.removeItem(BK_KEY);
    });

    await test('Zurücksetzen bleibt gelöscht', 'Speichern', function() {
      var good = localStorage.getItem('finanzplaner_v3');
      FP.Store.load();
      FP.Store.wipe();
      FP.Store.appLog('RESET', 'danach');
      FP.Store.Transactions.add({ amount: 8.88, date: '04.2026', categoryId: 'cat_sonstiges', note: 'Z' });
      assert(localStorage.getItem('finanzplaner_v3') === null, 'Daten nach wipe() wieder geschrieben');
      localStorage.setItem('finanzplaner_v3', good);
      FP.Store.load();
    });

    // ── 3c. Vorlagen-Regel (Paket 3, 18.10.2026) ──────────────────────────────

    function recTx(name, date) {
      var ids = FP.Store.Recurring.getAll().filter(function(r) { return r.name === name; }).map(function(r) { return r.id; });
      return FP.Store.Transactions.getAll().filter(function(t) {
        return t.source === 'recurring' && ids.indexOf(t.recurringId) >= 0 && (!date || t.date === date);
      });
    }

    await test('Gleicher Startmonat: eine Buchung je Monat, Start bleibt stabil', 'Vorlagen', function() {
      FP.Store.load();
      FP.Store.Recurring.add({ name: 'T-Gleichstart', amount: 10, validFrom: '01.2025', validUntil: '01.2025' });
      FP.Store.Recurring.add({ name: 'T-Gleichstart', amount: 12, validFrom: '01.2025' });
      var jan = recTx('T-Gleichstart', '01.2025');
      assert(jan.length === 1 && jan[0].amount === 12, 'Jan 2025: ' + jan.map(function(t) { return t.amount; }).join('+'));
      var a = FP.Store.cleanupRecurringDuplicates({ silent: true });
      var b = FP.Store.generateRecurringTransactions({ retroactive: true, silent: true });
      assert(a === 0 && b === 0, 'Start ändert noch etwas: ' + a + ' entfernt, ' + b + ' gebucht');
    });

    await test('↕ Betrag ab Monat: beide Versionen richtig, Ende übernommen', 'Vorlagen', function() {
      var r = FP.Store.Recurring.add({ name: 'T-Split', amount: 100, validFrom: '01.2025', validUntil: '12.2025' });
      FP.Store.Recurring.split(r.id, '06.2025', 120);
      var all = recTx('T-Split');
      assert(all.length === 12, 'Monate: ' + all.length);
      assert(all.every(function(t) { return t.amount === (parseInt(t.date) < 6 ? 100 : 120); }), 'Beträge falsch');
      var neu = FP.Store.Recurring.getAll().filter(function(x) { return x.name === 'T-Split' && x.validFrom === '06.2025'; })[0];
      assert(neu && neu.validUntil === '12.2025', 'Ende der neuen Version: ' + (neu && neu.validUntil));
    });

    await test('✏️ korrigiert den ganzen Zeitraum und behält das Ende', 'Vorlagen', function() {
      var r = FP.Store.Recurring.add({ name: 'T-Edit', amount: 50, validFrom: '01.2025', validUntil: '03.2025' });
      FP.Store.Recurring.update(r.id, { amount: 60, validFrom: '01.2025' });
      var all = recTx('T-Edit');
      assert(all.length === 3 && all.every(function(t) { return t.amount === 60; }), all.map(function(t) { return t.amount; }).join(','));
      assert(FP.Store.Recurring.getAll().filter(function(x) { return x.id === r.id; })[0].validUntil === '03.2025', 'Ende verloren');
    });

    await test('Ungültiger Zeitraum oder Typ wird abgelehnt', 'Vorlagen', function() {
      var r = FP.Store.Recurring.add({ name: 'T-Check', amount: 5, validFrom: '03.2025', validUntil: '04.2025' });
      var n = 0;
      try { FP.Store.Recurring.update(r.id, { validUntil: '02.2025' }); } catch(e) { n++; }
      try { FP.Store.Recurring.update(r.id, { type: '' }); } catch(e) { n++; }
      try { FP.Store.Recurring.add({ name: 'T-Check2', amount: 5, validFrom: '13.2025' }); } catch(e) { n++; }
      assert(n === 3, 'nur ' + n + ' von 3 abgelehnt');
    });

    await test('Fixkosten-Buchung verschieben bleibt verschoben', 'Vorlagen', function() {
      FP.Store.Recurring.add({ name: 'T-Move', amount: 7, validFrom: '01.2025', validUntil: '03.2025' });
      var feb = recTx('T-Move', '02.2025')[0];
      FP.Store.Transactions.edit(feb.id, { date: '03.2025' });
      FP.Store.generateRecurringTransactions({ retroactive: true });
      var moved = FP.Store.Transactions.getById(feb.id);
      assert(moved && moved.date === '03.2025' && moved.source === 'manual', 'Buchung nicht gelöst');
      assert(recTx('T-Move', '02.2025').length === 0, 'Februar wurde neu gebucht');
    });

    // ── 4. Rentenberechnung ───────────────────────────────────────────────────

    await test('calcRente gibt vollständiges Ergebnis zurück', 'Rentenberechnung', function() {
      var r = FP.Calculator.calcRente('person_1', null);
      assert(r !== null, 'calcRente gab null zurück — retirement.profiles[person_1] fehlt?');
      var alleFelder = ['personId','currentAge','yearsToRetire','targetRetirementAge',
                        'punkteBeiRente','gesetzlicheMonatsrenteBrutto','gesetzlicheMonatsrente',
                        'gesamtEinkommen','depotAtRetire','luecke','zugangsfaktor'];
      var numFelder  = alleFelder.filter(function(k) { return k !== 'personId' && k !== 'scenario'; });
      alleFelder.forEach(function(k) { assert(k in r, 'Feld fehlt: ' + k); });
      numFelder.forEach(function(k) { assertNum(r[k], k); });
    });

    await test('Rentenberechnung: alle Werte nicht-negativ', 'Rentenberechnung', function() {
      var r = FP.Calculator.calcRente('person_1', null);
      assertGte(r.punkteBeiRente,               0, 'punkteBeiRente');
      assertGte(r.gesetzlicheMonatsrenteBrutto, 0, 'gesetzlicheMonatsrenteBrutto');
      assertGte(r.gesetzlicheMonatsrente,       0, 'gesetzlicheMonatsrente');
      assertGte(r.gesamtEinkommen,              0, 'gesamtEinkommen');
      assertGte(r.depotAtRetire,                0, 'depotAtRetire');
      assertGte(r.luecke,                       0, 'luecke');
      assertGte(r.zugangsfaktor,                0, 'zugangsfaktor');
    });

    await test('Rentenberechnung: Alter plausibel', 'Rentenberechnung', function() {
      var r = FP.Calculator.calcRente('person_1', null);
      assert(r.currentAge > 0 && r.currentAge < 120, 'currentAge unplausibel: ' + r.currentAge);
      assert(r.targetRetirementAge >= 55 && r.targetRetirementAge <= 75,
        'targetRetirementAge unplausibel: ' + r.targetRetirementAge);
    });

    await test('Rentenberechnung: Brutto ≥ Netto (Steuern und Abgaben)', 'Rentenberechnung', function() {
      var r = FP.Calculator.calcRente('person_1', null);
      assert(
        r.gesetzlicheMonatsrenteBrutto >= r.gesetzlicheMonatsrente,
        'Brutto (' + r.gesetzlicheMonatsrenteBrutto + ') < Netto (' + r.gesetzlicheMonatsrente + ')'
      );
    });

    await test('Höheres Gehalt → höhere gesetzliche Rente', 'Rentenberechnung', function() {
      // Niedrige Gehälter setzen
      FP.Store.Salary.set('person_1', '06.2025', { grossSalary: 1500, netSalary: 1200 });
      var rNiedrig = FP.Calculator.calcRente('person_1', null);

      // Gleichen Monat mit hohem Gehalt überschreiben
      FP.Store.Salary.set('person_1', '06.2025', { grossSalary: 9000, netSalary: 6000 });
      var rHoch = FP.Calculator.calcRente('person_1', null);

      assert(
        rHoch.gesetzlicheMonatsrenteBrutto >= rNiedrig.gesetzlicheMonatsrenteBrutto,
        'Höheres Gehalt ergab niedrigere Rente: ' +
        rNiedrig.gesetzlicheMonatsrenteBrutto + ' → ' + rHoch.gesetzlicheMonatsrenteBrutto
      );
    });

  } finally {
    restoreRealStore();
    renderResults();
    document.getElementById('run').disabled = false;
  }
}

function renderResults() {
  var passed = _results.filter(function(r) { return r.ok; }).length;
  var failed  = _results.length - passed;
  var html = '';

  html += '<div class="summary ' + (failed === 0 ? 'ok' : 'err') + '">';
  html += failed === 0
    ? '✓ Alle ' + passed + ' Tests bestanden'
    : '✗ ' + failed + ' von ' + _results.length + ' Tests fehlgeschlagen';
  html += '</div>';

  html += '<table><tr><th style="width:45%">Test</th><th>Kategorie</th><th>Ergebnis</th></tr>';
  _results.forEach(function(r) {
    html += '<tr>';
    html += '<td>' + esc(r.name);
    if (r.err) html += '<div class="err-msg">' + esc(r.err) + '</div>';
    html += '</td>';
    html += '<td>' + esc(r.category) + '</td>';
    html += '<td class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? '✓ OK' : '✗ FAIL') + '</td>';
    html += '</tr>';
  });
  html += '</table>';

  document.getElementById('results').innerHTML = html;
  document.getElementById('notice').textContent =
    'Deine eigenen Daten wurden nicht verändert — Tests liefen auf einem isolierten Datensatz.';
}
</script>
