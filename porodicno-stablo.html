<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Porodično stablo</title>
<style>
:root{
  --bg:#faf7f2;
  --card:#ffffff;
  --accent:#1f6f5c;
  --accent-dark:#154d40;
  --accent-light:#e3f1ec;
  --text:#2b2b2b;
  --text-light:#6b6b6b;
  --danger:#b3402f;
  --border:#e2ddd3;
  --shadow:0 2px 10px rgba(0,0,0,0.10);
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:18px;line-height:1.4;}
header{display:flex;align-items:center;gap:8px;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
header h1{flex:1;text-align:center;font-size:22px;margin:0;color:var(--accent-dark);}
.icon-btn{font-size:26px;background:none;border:none;cursor:pointer;padding:8px 10px;border-radius:12px;color:var(--accent-dark);}
.icon-btn:hover{background:var(--accent-light);}
.icon-btn:disabled{opacity:0.3;cursor:default;}
.icon-btn:disabled:hover{background:none;}

main#view{position:relative;max-width:1000px;margin:0 auto;}
#connector-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;}
.connector-line{stroke:var(--accent);stroke-opacity:0.4;stroke-width:3;stroke-linecap:round;}
#view-inner{position:relative;z-index:1;padding:16px 12px 60px;display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;}
.row{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:safe center;align-items:flex-start;gap:12px;width:100%;padding:2px 2px 8px;}
.row-center{align-items:center;}

.tile{width:82px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;position:relative;padding-top:4px;}
.tile-focus{width:104px;}
.tile-photo{width:58px;height:58px;border-radius:13px;overflow:hidden;box-shadow:var(--shadow);background:var(--card);position:relative;display:flex;align-items:center;justify-content:center;border:3px solid var(--border);}
.tile-focus .tile-photo{width:84px;height:84px;border-width:4px;}
.tile-photo img{width:100%;height:100%;object-fit:cover;}
.avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:18%;box-sizing:border-box;}
.tile-rel{width:100%;font-size:11px;color:var(--text-light);margin-top:5px;}
.tile-name{width:100%;font-weight:600;margin-top:1px;font-size:13px;word-break:break-word;}
.tile-focus .tile-name{font-size:15px;}
.tile-year{width:100%;font-size:11px;color:var(--text-light);}
.tile-edit{position:absolute;top:-4px;right:2px;background:var(--card);border:1px solid var(--border);border-radius:50%;width:24px;height:24px;font-size:11px;cursor:pointer;box-shadow:var(--shadow);}
.tile-action{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer;box-shadow:var(--shadow);top:-4px;}
.tile-unlink{right:-4px;color:var(--danger);}
.tile-star{left:-4px;font-size:13px;}

.tile-add{width:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--accent-dark);}
.tile-add .tile-add-icon{width:58px;height:58px;border-radius:13px;border:3px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--card);}
.tile-add .tile-add-label{margin-top:5px;font-size:11px;text-align:center;}
.tile-add:hover .tile-add-icon{border-color:var(--accent);}

.empty-state{text-align:center;padding:60px 20px;max-width:420px;}
.empty-icon{font-size:60px;margin:0;}

.btn{font-size:18px;padding:14px 22px;border-radius:12px;border:none;cursor:pointer;font-weight:600;}
.btn-big{min-height:56px;width:100%;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-secondary{background:var(--accent-light);color:var(--accent-dark);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-text{background:none;color:var(--text-light);text-decoration:underline;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;}
.overlay.hidden{display:none;}
.modal{background:var(--card);border-radius:var(--radius);padding:26px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;}
.modal h2{margin-top:0;color:var(--accent-dark);}
.modal-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.modal-actions-vertical{display:flex;flex-direction:column;gap:12px;margin-top:10px;}

form label{display:block;margin-bottom:14px;font-weight:600;font-size:16px;}
form input[type=text], form input[type=number], form textarea{width:100%;font-size:17px;padding:10px;margin-top:6px;border:1px solid var(--border);border-radius:10px;font-family:inherit;}
.radio-group{display:flex;gap:16px;font-weight:400;font-size:16px;margin-top:6px;flex-wrap:wrap;}
.radio-group label{margin:0;display:flex;align-items:center;gap:6px;font-weight:400;}
.foto-preview-img{max-width:140px;border-radius:12px;margin-top:8px;display:block;}

.existing-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer;}
.existing-row:hover{background:var(--accent-light);}
.existing-avatar{width:44px;height:44px;border-radius:10px;overflow:hidden;flex-shrink:0;border:2px solid var(--border);box-sizing:border-box;}
.existing-avatar img{width:100%;height:100%;object-fit:cover;}
#existing-search{width:100%;font-size:16px;padding:10px;border:1px solid var(--border);border-radius:10px;margin:10px 0;}

.detail-photo{display:flex;justify-content:center;margin-bottom:12px;}
.detail-photo img, .avatar-fallback-lg{width:160px;height:160px;border-radius:22px;object-fit:cover;border:5px solid var(--border);box-sizing:border-box;}
.avatar-fallback-lg{display:flex;align-items:center;justify-content:center;padding:18%;box-sizing:border-box;}
.detail-year{color:var(--text-light);text-align:center;}
.detail-maiden{color:var(--text-light);text-align:center;margin-top:-8px;font-style:italic;}
.detail-relation{background:var(--accent-light);color:var(--accent-dark);padding:10px 14px;border-radius:10px;text-align:center;}
.detail-notes{white-space:pre-wrap;}
.settings-hint{font-size:14px;color:var(--text-light);}
.hidden{display:none;}

@media (max-width:380px){
  .tile{width:70px;}
  .tile-photo{width:48px;height:48px;}
  .tile-focus .tile-photo{width:70px;height:70px;}
  .tile-focus{width:88px;}
}
</style>
</head>
<body>
<header>
  <button id="btn-back" class="icon-btn" title="Nazad">←</button>
  <button id="btn-home" class="icon-btn" title="Početna osoba">🏠</button>
  <h1>🌳 Porodično stablo</h1>
  <button id="btn-settings" class="icon-btn" title="Podešavanja">⚙️</button>
</header>
<main id="view">
  <svg id="connector-svg"></svg>
  <div id="view-inner"></div>
</main>

<div id="modal-overlay" class="overlay hidden">
  <div id="modal-box" class="modal"></div>
</div>

<script>
const LS_KEY = 'porodicnoStablo_v1';
let state = loadState();
let historyStack = [];

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return { people: parsed.people || {}, rootId: parsed.rootId || null, focusId: parsed.focusId || parsed.rootId || null };
    }
  }catch(e){}
  return { people:{}, rootId:null, focusId:null };
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function getPerson(id){ return state.people[id]; }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function genderStyle(spol){
  if(spol==='M') return { border:'#3d6ea5', bg:'#dce8f4', fg:'#3d6ea5', shape:'m' };
  if(spol==='Z') return { border:'#b5566f', bg:'#f6e2e8', fg:'#b5566f', shape:'f' };
  return { border:'#9a9a9a', bg:'#e9e9e6', fg:'#8a8a8a', shape:'n' };
}
function silhouetteSvg(shape, fg){
  const body = shape==='f'
    ? '<path d="M50,46 L38,60 L29,93 L71,93 L62,60 Z"/>'
    : '<path d="M50,46 L35,50 L32,93 L68,93 L65,50 Z"/>';
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" fill="${fg}" aria-hidden="true"><circle cx="50" cy="27" r="16"/>${body}</svg>`;
}

function getParents(id){ const p=getPerson(id); return (p.parentIds||[]).map(pid=>state.people[pid]).filter(Boolean); }
function getChildren(id){ return Object.values(state.people).filter(p=>(p.parentIds||[]).includes(id)); }
function getSpouses(id){ const p=getPerson(id); return (p.spouseIds||[]).map(sid=>state.people[sid]).filter(Boolean); }
function getSiblings(id){
  const p = getPerson(id);
  const parentIds = p.parentIds || [];
  const seen = new Set();
  const result = [];
  if(parentIds.length){
    Object.values(state.people).forEach(o=>{
      if(o.id===id) return;
      if((o.parentIds||[]).some(pid=>parentIds.includes(pid)) && !seen.has(o.id)){ seen.add(o.id); result.push(o); }
    });
  }
  (p.siblingIds||[]).forEach(sid=>{
    if(sid!==id && !seen.has(sid)){
      const o = getPerson(sid);
      if(o){ seen.add(sid); result.push(o); }
    }
  });
  return result;
}

function parentLabel(p){ return p.spol==='M' ? 'Otac' : p.spol==='Z' ? 'Majka' : 'Roditelj'; }
function childLabel(p){ return p.spol==='M' ? 'Sin' : p.spol==='Z' ? 'Kćerka' : 'Dijete'; }
function siblingLabel(p){ return p.spol==='M' ? 'Brat' : p.spol==='Z' ? 'Sestra' : 'Brat/Sestra'; }
function spouseLabel(p){ return p.spol==='M' ? 'Suprug' : p.spol==='Z' ? 'Supruga' : 'Supružnik/Partner'; }
function fullName(p){
  if(!p) return '';
  return p.prezime ? `${p.ime} ${p.prezime}` : p.ime;
}

function ancestorsWithDistance(personId, maxDepth){
  const result = new Map([[personId, 0]]);
  let frontier = [personId];
  let depth = 0;
  while(frontier.length && depth < maxDepth){
    depth++;
    const next = [];
    frontier.forEach(id=>{
      const p = getPerson(id);
      (p.parentIds||[]).forEach(pid=>{
        if(!result.has(pid)){ result.set(pid, depth); next.push(pid); }
      });
    });
    frontier = next;
  }
  return result;
}
function findSideParent(rootId, ancestorId){
  const root = getPerson(rootId);
  for(const pid of (root.parentIds||[])){
    const parent = getPerson(pid);
    if(parent && (parent.parentIds||[]).includes(ancestorId)) return parent;
  }
  return null;
}
function computeRelationship(rootId, targetId){
  if(rootId===targetId) return null;
  const root = getPerson(rootId);
  const target = getPerson(targetId);
  if(!root || !target) return null;
  if((root.spouseIds||[]).includes(targetId)) return spouseLabel(target);

  const ancR = ancestorsWithDistance(rootId, 3);
  const ancT = ancestorsWithDistance(targetId, 3);

  if(ancR.has(targetId)){
    const d = ancR.get(targetId);
    if(d===1) return parentLabel(target);
    if(d===2) return target.spol==='M' ? 'Djed' : target.spol==='Z' ? 'Baka' : 'Djed/Baka';
    if(d===3) return target.spol==='M' ? 'Pradjed' : target.spol==='Z' ? 'Prababa' : 'Pradjed/Prababa';
    return null;
  }
  if(ancT.has(rootId)){
    const d = ancT.get(rootId);
    if(d===1) return childLabel(target);
    if(d===2) return target.spol==='M' ? 'Unuk' : target.spol==='Z' ? 'Unuka' : 'Unuk/Unuka';
    if(d===3) return target.spol==='M' ? 'Praunuk' : target.spol==='Z' ? 'Praunuka' : 'Praunuk/Praunuka';
    return null;
  }
  let best = null;
  ancR.forEach((a, id)=>{
    if(id===rootId) return;
    if(ancT.has(id)){
      const b = ancT.get(id);
      if(!best || (a+b) < (best.a+best.b)) best = { id, a, b };
    }
  });
  if(!best) return null;
  if(best.a===1 && best.b===1) return siblingLabel(target);
  if(best.a===2 && best.b===1){
    if(target.spol==='Z') return 'Tetka';
    if(target.spol==='M'){
      const sideParent = findSideParent(rootId, best.id);
      if(sideParent && sideParent.spol==='M') return 'Stric';
      if(sideParent && sideParent.spol==='Z') return 'Ujak';
      return 'Stric/Ujak';
    }
    return 'Tetka/Stric/Ujak';
  }
  if(best.a===1 && best.b===2) return target.spol==='M' ? 'Nećak' : target.spol==='Z' ? 'Nećakinja' : 'Nećak/Nećakinja';
  if(best.a===2 && best.b===2) return target.spol==='M' ? 'Rođak' : target.spol==='Z' ? 'Rođaka' : 'Rođak/Rođaka';
  return null;
}

function navigateTo(id){
  if(id===state.focusId) return;
  historyStack.push(state.focusId);
  state.focusId = id;
  saveState(); render();
}
function goBack(){
  if(!historyStack.length) return;
  state.focusId = historyStack.pop();
  saveState(); render();
}
function goHome(){
  if(state.rootId && state.rootId!==state.focusId) navigateTo(state.rootId);
}
function setAsHome(){
  state.rootId = state.focusId;
  saveState(); render();
}

function addParentToFocus(parentId){
  const focus = getPerson(state.focusId);
  const existingSiblings = getSiblings(state.focusId);
  focus.parentIds = focus.parentIds || [];
  if(!focus.parentIds.includes(parentId)) focus.parentIds.push(parentId);
  existingSiblings.forEach(sib=>{
    sib.parentIds = sib.parentIds || [];
    if(!sib.parentIds.includes(parentId)) sib.parentIds.push(parentId);
  });
}
function addPerson(data, type){
  const id = uid();
  const person = { id, ime:data.ime.trim(), prezime:data.prezime||'', djevojackoPrezime:data.djevojackoPrezime||'', godina:data.godina||'', spol:data.spol||'', foto:data.foto||null, biljeske:data.biljeske||'', parentIds:[], spouseIds:[] };
  const focus = getPerson(state.focusId);
  if(type==='parent'){
    addParentToFocus(id);
  } else if(type==='child'){
    person.parentIds = [state.focusId];
  } else if(type==='spouse'){
    person.spouseIds = [state.focusId];
    focus.spouseIds = focus.spouseIds || [];
    focus.spouseIds.push(id);
  } else if(type==='sibling'){
    if((focus.parentIds||[]).length){
      person.parentIds = [...focus.parentIds];
    } else {
      person.siblingIds = [state.focusId];
      focus.siblingIds = focus.siblingIds || [];
      focus.siblingIds.push(id);
    }
  }
  state.people[id] = person;
  saveState(); closeModal(); render();
}
function addRootPerson(data){
  const id = uid();
  state.people[id] = { id, ime:data.ime.trim(), prezime:data.prezime||'', djevojackoPrezime:data.djevojackoPrezime||'', godina:data.godina||'', spol:data.spol||'', foto:data.foto||null, biljeske:data.biljeske||'', parentIds:[], spouseIds:[] };
  state.rootId = id;
  state.focusId = id;
  saveState(); closeModal(); render();
}
function updatePerson(id, data){
  const p = getPerson(id);
  p.ime = data.ime.trim();
  p.prezime = data.prezime || '';
  p.djevojackoPrezime = data.djevojackoPrezime || '';
  p.godina = data.godina || '';
  p.spol = data.spol || '';
  p.biljeske = data.biljeske || '';
  if(data.foto) p.foto = data.foto;
  saveState(); closeModal(); render();
}
function deletePerson(id){
  Object.values(state.people).forEach(p=>{
    if(p.parentIds) p.parentIds = p.parentIds.filter(pid=>pid!==id);
    if(p.spouseIds) p.spouseIds = p.spouseIds.filter(sid=>sid!==id);
  });
  delete state.people[id];
  const remaining = Object.keys(state.people);
  if(state.rootId===id) state.rootId = remaining[0] || null;
  if(state.focusId===id) state.focusId = state.rootId;
  historyStack = historyStack.filter(h=>h!==id && state.people[h]);
  saveState(); closeModal(); render();
}
function linkExisting(type, existingId){
  const focus = getPerson(state.focusId);
  const other = getPerson(existingId);
  if(type==='parent'){
    addParentToFocus(existingId);
  } else if(type==='child'){
    other.parentIds = other.parentIds || [];
    if(!other.parentIds.includes(state.focusId)) other.parentIds.push(state.focusId);
  } else if(type==='spouse'){
    focus.spouseIds = focus.spouseIds || [];
    other.spouseIds = other.spouseIds || [];
    if(!focus.spouseIds.includes(existingId)) focus.spouseIds.push(existingId);
    if(!other.spouseIds.includes(state.focusId)) other.spouseIds.push(state.focusId);
  } else if(type==='sibling'){
    if((focus.parentIds||[]).length){
      other.parentIds = Array.from(new Set([...(other.parentIds||[]), ...(focus.parentIds||[])]));
    } else {
      focus.siblingIds = focus.siblingIds || [];
      other.siblingIds = other.siblingIds || [];
      if(!focus.siblingIds.includes(existingId)) focus.siblingIds.push(existingId);
      if(!other.siblingIds.includes(state.focusId)) other.siblingIds.push(state.focusId);
    }
  }
  saveState(); closeModal(); render();
}
function unlinkRelation(type, otherId){
  const focus = getPerson(state.focusId);
  const other = getPerson(otherId);
  if(type==='parent'){
    focus.parentIds = (focus.parentIds||[]).filter(pid=>pid!==otherId);
  } else if(type==='child'){
    other.parentIds = (other.parentIds||[]).filter(pid=>pid!==state.focusId);
  } else if(type==='spouse'){
    focus.spouseIds = (focus.spouseIds||[]).filter(sid=>sid!==otherId);
    other.spouseIds = (other.spouseIds||[]).filter(sid=>sid!==state.focusId);
  }
  saveState(); render();
}

function resizeImage(file, maxDim=400){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width>height){ if(width>maxDim){ height*=maxDim/width; width=maxDim; } }
        else { if(height>maxDim){ width*=maxDim/height; height=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function openModal(html){
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('modal-box').innerHTML = '';
}
function showConfirm(message, onYes){
  openModal(`
    <h2>Potvrda</h2>
    <p>${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn btn-danger btn-big" id="confirm-yes">Da</button>
      <button class="btn btn-text" onclick="closeModal()">Otkaži</button>
    </div>
  `);
  document.getElementById('confirm-yes').addEventListener('click', onYes);
}
function confirmDeletePerson(id){
  const p = getPerson(id);
  showConfirm(`Da li ste sigurni da želite obrisati osobu "${fullName(p)}"? Ova radnja se ne može poništiti.`, ()=>deletePerson(id));
}
function confirmUnlink(type, id){
  showConfirm('Ukloniti ovu vezu? Osoba neće biti obrisana, samo veza sa ovom osobom.', ()=>unlinkRelation(type,id));
}

function openAddFlow(type){
  const titles = { parent:'roditelja', spouse:'supružnika/partnera', child:'dijete', sibling:'brata/sestru' };
  openModal(`
    <h2>Dodaj ${titles[type]}</h2>
    <div class="modal-actions-vertical">
      <button class="btn btn-primary btn-big" onclick="openPersonFormNew('${type}')">➕ Nova osoba</button>
      <button class="btn btn-secondary btn-big" onclick="openExistingPicker('${type}')">🔗 Poveži postojeću osobu</button>
      <button class="btn btn-text" onclick="closeModal()">Otkaži</button>
    </div>
  `);
}
function openPersonFormNew(type){
  openModal(personFormTemplate(null, type));
  wireFormEvents(null, type);
}
function openEditPerson(id){
  openModal(personFormTemplate(id, null));
  wireFormEvents(id, null);
}
function personFormTemplate(editId, type){
  const p = editId ? getPerson(editId) : null;
  const titleMap = { parent:'Dodaj roditelja', child:'Dodaj dijete', spouse:'Dodaj supružnika/partnera', sibling:'Dodaj brata/sestru', root:'Dodaj prvu osobu' };
  const title = editId ? `Uredi: ${escapeHtml(fullName(p))}` : (titleMap[type] || 'Dodaj osobu');
  let prefillPrezime = p ? (p.prezime||'') : '';
  if(!p && (type==='child' || type==='sibling')){
    const focus = getPerson(state.focusId);
    prefillPrezime = focus && focus.prezime ? focus.prezime : '';
  }
  return `
    <h2>${title}</h2>
    <form id="person-form">
      <label>Ime *<input required type="text" id="f-ime" value="${p?escapeHtml(p.ime):''}"></label>
      <label>Prezime<input type="text" id="f-prezime" value="${escapeHtml(prefillPrezime)}"></label>
      <label>Djevojačko prezime (opcionalno)<input type="text" id="f-djevojacko" value="${p?escapeHtml(p.djevojackoPrezime||''):''}"></label>
      <label>Godina rođenja<input type="number" id="f-godina" value="${p&&p.godina?escapeHtml(String(p.godina)):''}" min="1850" max="2026"></label>
      <label>Spol
        <div class="radio-group">
          <label><input type="radio" name="f-spol" value="M" ${p&&p.spol==='M'?'checked':''}> Muško</label>
          <label><input type="radio" name="f-spol" value="Z" ${p&&p.spol==='Z'?'checked':''}> Žensko</label>
          <label><input type="radio" name="f-spol" value="" ${!p||!p.spol?'checked':''}> Ne znam</label>
        </div>
      </label>
      <label>Fotografija<input type="file" id="f-foto" accept="image/*"></label>
      <div id="f-foto-preview">${p&&p.foto?`<img src="${p.foto}" class="foto-preview-img">`:''}</div>
      <label>Bilješke / informacije<textarea id="f-biljeske" rows="4">${p?escapeHtml(p.biljeske||''):''}</textarea></label>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary btn-big">💾 Sačuvaj</button>
        ${editId?`<button type="button" class="btn btn-danger" onclick="confirmDeletePerson('${editId}')">🗑️ Obriši osobu</button>`:''}
        <button type="button" class="btn btn-text" onclick="closeModal()">Otkaži</button>
      </div>
    </form>
  `;
}
function wireFormEvents(editId, type){
  const form = document.getElementById('person-form');
  let pendingFoto = editId ? getPerson(editId).foto : null;
  document.getElementById('f-foto').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    pendingFoto = await resizeImage(file);
    document.getElementById('f-foto-preview').innerHTML = `<img src="${pendingFoto}" class="foto-preview-img">`;
  });
  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    const ime = document.getElementById('f-ime').value.trim();
    if(!ime) return;
    const prezime = document.getElementById('f-prezime').value.trim();
    const djevojackoPrezime = document.getElementById('f-djevojacko').value.trim();
    const godina = document.getElementById('f-godina').value;
    const spol = form.querySelector('input[name="f-spol"]:checked')?.value || '';
    const biljeske = document.getElementById('f-biljeske').value;
    const data = { ime, prezime, djevojackoPrezime, godina, spol, biljeske, foto: pendingFoto };
    if(editId) updatePerson(editId, data);
    else if(type==='root') addRootPerson(data);
    else addPerson(data, type);
  });
}

function openExistingPicker(type){
  const focus = getPerson(state.focusId);
  const excludeIds = new Set([focus.id]);
  if(type==='parent') (focus.parentIds||[]).forEach(id=>excludeIds.add(id));
  if(type==='spouse') (focus.spouseIds||[]).forEach(id=>excludeIds.add(id));
  if(type==='child') Object.values(state.people).filter(p=>(p.parentIds||[]).includes(focus.id)).forEach(p=>excludeIds.add(p.id));
  const candidates = Object.values(state.people).filter(p=>!excludeIds.has(p.id));
  const listHtml = candidates.length ? candidates.map(p=>`
    <div class="existing-row" onclick="linkExisting('${type}','${p.id}')">
      <div class="existing-avatar" style="border-color:${genderStyle(p.spol).border}">${p.foto?`<img src="${p.foto}" style="width:100%;height:100%;object-fit:cover;">`:`<div class="avatar-fallback" style="background:${genderStyle(p.spol).bg}">${silhouetteSvg(genderStyle(p.spol).shape, genderStyle(p.spol).fg)}</div>`}</div>
      <div>${escapeHtml(fullName(p))}${p.godina?` (r. ${escapeHtml(String(p.godina))})`:''}</div>
    </div>`).join('') : '<p>Nema drugih osoba za povezivanje.</p>';
  openModal(`
    <h2>Poveži postojeću osobu</h2>
    <input type="text" id="existing-search" placeholder="Pretraži ime..." oninput="filterExistingList(this.value)">
    <div id="existing-list">${listHtml}</div>
    <div class="modal-actions"><button class="btn btn-text" onclick="closeModal()">Otkaži</button></div>
  `);
}
function filterExistingList(q){
  q = q.toLowerCase();
  document.querySelectorAll('#existing-list .existing-row').forEach(row=>{
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function openPersonDetail(id){
  const p = getPerson(id);
  const maidenHtml = p.djevojackoPrezime ? `<p class="detail-maiden">rođ. ${escapeHtml(p.djevojackoPrezime)}</p>` : '';
  let relHtml = '';
  if(state.rootId && state.rootId !== id){
    const rel = computeRelationship(state.rootId, id);
    if(rel) relHtml = `<p class="detail-relation">Odnos prema ${escapeHtml(fullName(getPerson(state.rootId)))}: <strong>${escapeHtml(rel)}</strong></p>`;
  }
  openModal(`
    <h2>${escapeHtml(fullName(p))}</h2>
    ${maidenHtml}
    <div class="detail-photo">${p.foto?`<img src="${p.foto}" style="border-color:${genderStyle(p.spol).border}">`:`<div class="avatar-fallback-lg" style="background:${genderStyle(p.spol).bg};border-color:${genderStyle(p.spol).border}">${silhouetteSvg(genderStyle(p.spol).shape, genderStyle(p.spol).fg)}</div>`}</div>
    ${p.godina?`<p class="detail-year">Rođen/a: ${escapeHtml(String(p.godina))}.</p>`:''}
    ${relHtml}
    <p class="detail-notes">${p.biljeske?escapeHtml(p.biljeske).replace(/\n/g,'<br>'):'<em>Nema bilješki.</em>'}</p>
    <div class="modal-actions">
      <button class="btn btn-primary btn-big" onclick="openEditPerson('${id}')">✏️ Uredi</button>
      <button class="btn btn-text" onclick="closeModal()">Zatvori</button>
    </div>
  `);
}

function reachableIds(rootId){
  const seen = new Set();
  if(!rootId || !state.people[rootId]) return seen;
  seen.add(rootId);
  const queue = [rootId];
  while(queue.length){
    const id = queue.shift();
    const p = getPerson(id);
    const neighbors = [...(p.parentIds||[]), ...(p.spouseIds||[]), ...(p.siblingIds||[])];
    Object.values(state.people).forEach(o=>{ if((o.parentIds||[]).includes(id)) neighbors.push(o.id); });
    neighbors.forEach(nid=>{
      if(nid && state.people[nid] && !seen.has(nid)){ seen.add(nid); queue.push(nid); }
    });
  }
  return seen;
}
function removeOrphans(){
  const reach = reachableIds(state.rootId);
  const orphanIds = Object.keys(state.people).filter(id=>!reach.has(id));
  if(!orphanIds.length) return;
  showConfirm(`Ovo će trajno obrisati ${orphanIds.length} osoba koje trenutno nisu povezane sa stablom. Nastaviti?`, ()=>{
    orphanIds.forEach(id=>{ delete state.people[id]; });
    saveState(); closeModal(); render();
  });
}
function openSettings(){
  const total = Object.keys(state.people).length;
  const reach = reachableIds(state.rootId);
  const orphanCount = total - reach.size;
  const orphanHint = orphanCount>0
    ? `<p class="settings-hint">Od toga ${orphanCount} osoba trenutno nije povezano sa stablom (npr. iz ranijeg testiranja).</p>
       <button class="btn btn-secondary btn-big" onclick="removeOrphans()">🗑️ Ukloni nepovezane osobe (${orphanCount})</button>`
    : '';
  openModal(`
    <h2>⚙️ Podešavanja</h2>
    <p>Broj osoba u stablu: ${total}</p>
    ${orphanHint}
    <div class="modal-actions-vertical">
      <button class="btn btn-primary btn-big" onclick="exportBackup()">⬇️ Preuzmi sigurnosnu kopiju</button>
      <button class="btn btn-secondary btn-big" onclick="document.getElementById('import-file-input').click()">⬆️ Učitaj sigurnosnu kopiju</button>
      <input type="file" id="import-file-input" accept="application/json" class="hidden" onchange="importBackup(this.files[0])">
    </div>
    <p class="settings-hint">Savjet: Ako je folder "Preuzimanja" na ovom računaru povezan sa OneDrive-om, sigurnosne kopije će se automatski sačuvati i na OneDrive-u.</p>
    <div class="modal-actions"><button class="btn btn-text" onclick="closeModal()">Zatvori</button></div>
  `);
}
function exportBackup(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `porodicno-stablo-sigurnosna-kopija-${dateStr}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed.people !== 'object') throw new Error('invalid');
      showConfirm('Ovo će zamijeniti sve trenutne podatke sačuvanom kopijom. Nastaviti?', ()=>{
        state = { people: parsed.people||{}, rootId: parsed.rootId||null, focusId: parsed.focusId||parsed.rootId||null };
        historyStack = [];
        saveState(); closeModal(); render();
      });
    }catch(err){
      alert('Datoteka nije ispravna sigurnosna kopija.');
    }
  };
  reader.readAsText(file);
}

function personTile(p, opts={}){
  const isFocus = !!opts.focus;
  const relLabel = opts.relLabel;
  const gs = genderStyle(p.spol);
  const photoHtml = p.foto
    ? `<img src="${p.foto}" alt="" onload="scheduleDrawConnectors()">`
    : `<div class="avatar-fallback" style="background:${gs.bg}">${silhouetteSvg(gs.shape, gs.fg)}</div>`;
  const godinaHtml = p.godina ? `<div class="tile-year">r. ${escapeHtml(String(p.godina))}</div>` : '';
  const unlinkBtn = opts.unlink ? `<button class="tile-action tile-unlink" title="Ukloni vezu" onclick="event.stopPropagation(); confirmUnlink('${opts.unlink.type}','${opts.unlink.id}')">✕</button>` : '';
  const starBtn = isFocus ? `<button class="tile-action tile-star" title="Postavi kao početnu osobu" onclick="event.stopPropagation(); setAsHome()">${state.rootId===p.id?'⭐':'☆'}</button>` : '';
  const clickAction = isFocus ? `openPersonDetail('${p.id}')` : `navigateTo('${p.id}')`;
  return `
    <div class="tile ${isFocus?'tile-focus':''}" data-role="${opts.role||''}" onclick="${clickAction}">
      <div class="tile-photo" style="border-color:${gs.border}">${photoHtml}${unlinkBtn}${starBtn}</div>
      ${relLabel?`<div class="tile-rel">${escapeHtml(relLabel)}</div>`:''}
      <div class="tile-name">${escapeHtml(fullName(p))}</div>
      ${godinaHtml}
      <button class="tile-edit" title="Uredi" onclick="event.stopPropagation(); openEditPerson('${p.id}')">✏️</button>
    </div>`;
}
function addTile(label, onclickFn){
  return `<div class="tile tile-add" onclick="${onclickFn}"><div class="tile-add-icon">➕</div><div class="tile-add-label">${escapeHtml(label)}</div></div>`;
}

function scheduleDrawConnectors(){ requestAnimationFrame(drawConnectors); }
function drawConnectors(){
  const svg = document.getElementById('connector-svg');
  const view = document.getElementById('view');
  if(!svg || !view) return;
  svg.innerHTML = '';
  const viewRect = view.getBoundingClientRect();

  const focusPhoto = view.querySelector('.tile-focus .tile-photo');
  if(!focusPhoto) return;

  function topOf(el){ const r=el.getBoundingClientRect(); return { x:r.left+r.width/2-viewRect.left, y:r.top-viewRect.top }; }
  function bottomOf(el){ const r=el.getBoundingClientRect(); return { x:r.left+r.width/2-viewRect.left, y:r.bottom-viewRect.top }; }
  function centerOf(el){ const r=el.getBoundingClientRect(); return { x:r.left+r.width/2-viewRect.left, y:r.top+r.height/2-viewRect.top }; }
  function addLine(a, b){
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('class', 'connector-line');
    svg.appendChild(line);
  }
  // Zeichnet eine Sammelleiste unter einer Gruppe (z.B. Eltern) und liefert den Ankerpunkt fuer den Stamm nach unten.
  function groupBar(els, gap){
    const pts = els.map(bottomOf);
    const barY = Math.max(...pts.map(p=>p.y)) + gap;
    pts.forEach(p=>addLine(p, { x:p.x, y:barY }));
    if(pts.length>1){
      const xs = pts.map(p=>p.x);
      addLine({ x:Math.min(...xs), y:barY }, { x:Math.max(...xs), y:barY });
    }
    const stemX = pts.reduce((s,p)=>s+p.x, 0) / pts.length;
    return { x:stemX, y:barY };
  }
  // Verbindet einen Ankerpunkt rechtwinklig mit einer Gruppe darunter (z.B. Kinder).
  function dropToGroup(sourcePt, els, gap){
    if(!els.length) return;
    const pts = els.map(topOf);
    const barY = Math.min(...pts.map(p=>p.y)) - gap;
    addLine(sourcePt, { x:sourcePt.x, y:barY });
    if(pts.length>1){
      const xs = pts.map(p=>p.x);
      addLine({ x:Math.min(...xs), y:barY }, { x:Math.max(...xs), y:barY });
    }
    pts.forEach(p=>addLine({ x:p.x, y:barY }, p));
  }

  const parentPhotos = Array.from(view.querySelectorAll('[data-role="parent"] .tile-photo'));
  const siblingPhotos = Array.from(view.querySelectorAll('[data-role="sibling"] .tile-photo'));
  const spousePhotos = Array.from(view.querySelectorAll('[data-role="spouse"] .tile-photo'));
  const childPhotos = Array.from(view.querySelectorAll('[data-role="child"] .tile-photo'));

  if(parentPhotos.length){
    const anchor = groupBar(parentPhotos, 14);
    dropToGroup(anchor, [focusPhoto, ...siblingPhotos], 14);
  } else if(siblingPhotos.length){
    const group = [focusPhoto, ...siblingPhotos];
    const pts = group.map(topOf);
    const barY = Math.min(...pts.map(p=>p.y)) - 14;
    pts.forEach(p=>addLine(p, { x:p.x, y:barY }));
    const xs = pts.map(p=>p.x);
    addLine({ x:Math.min(...xs), y:barY }, { x:Math.max(...xs), y:barY });
  }
  spousePhotos.forEach(sp=>addLine(centerOf(focusPhoto), centerOf(sp)));
  if(childPhotos.length){
    let source;
    if(spousePhotos.length===1){
      const a = bottomOf(focusPhoto), b = bottomOf(spousePhotos[0]);
      source = { x:(a.x+b.x)/2, y:Math.max(a.y,b.y) };
    } else {
      source = bottomOf(focusPhoto);
    }
    dropToGroup(source, childPhotos, 14);
  }
}
window.addEventListener('resize', scheduleDrawConnectors);

function render(){
  const view = document.getElementById('view-inner');
  const ids = Object.keys(state.people);
  document.getElementById('btn-back').disabled = historyStack.length===0;
  document.getElementById('btn-home').disabled = !state.rootId || state.rootId===state.focusId;

  if(ids.length===0){
    view.innerHTML = `
      <div class="empty-state">
        <p class="empty-icon">🌳</p>
        <h2>Dobrodošli!</h2>
        <p>Započnite kreiranje vašeg porodičnog stabla.</p>
        <button class="btn btn-primary btn-big" onclick="openPersonFormNew('root')">➕ Dodajte prvu osobu</button>
      </div>`;
    scheduleDrawConnectors();
    return;
  }

  let focus = getPerson(state.focusId);
  if(!focus){
    state.focusId = state.rootId && state.people[state.rootId] ? state.rootId : ids[0];
    saveState();
    focus = getPerson(state.focusId);
  }

  const parents = getParents(focus.id);
  const siblings = getSiblings(focus.id);
  const spouses = getSpouses(focus.id);
  const children = getChildren(focus.id);

  let html = '';

  html += '<div class="row row-parents">';
  parents.forEach(p=>{ html += personTile(p, { relLabel: parentLabel(p), unlink:{type:'parent', id:p.id}, role:'parent' }); });
  if(parents.length < 2){
    html += addTile(parents.length===0?'Dodaj roditelja':'Dodaj drugog roditelja', "openAddFlow('parent')");
  }
  html += '</div>';

  html += '<div class="row row-center">';
  siblings.forEach(s=>{ html += personTile(s, { relLabel: siblingLabel(s), role:'sibling' }); });
  html += addTile('Dodaj brata/sestru', "openAddFlow('sibling')");
  html += personTile(focus, { focus:true, role:'focus' });
  spouses.forEach(s=>{ html += personTile(s, { relLabel: spouseLabel(s), unlink:{type:'spouse', id:s.id}, role:'spouse' }); });
  html += addTile('Dodaj supružnika/partnera', "openAddFlow('spouse')");
  html += '</div>';

  html += '<div class="row row-children">';
  children.forEach(c=>{ html += personTile(c, { relLabel: childLabel(c), unlink:{type:'child', id:c.id}, role:'child' }); });
  html += addTile('Dodaj dijete', "openAddFlow('child')");
  html += '</div>';

  view.innerHTML = html;
  view.querySelectorAll('.row').forEach(row=>row.addEventListener('scroll', scheduleDrawConnectors, { passive:true }));
  scheduleDrawConnectors();
}

document.getElementById('btn-back').addEventListener('click', goBack);
document.getElementById('btn-home').addEventListener('click', goHome);
document.getElementById('btn-settings').addEventListener('click', openSettings);

render();
</script>
